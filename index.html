<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>생존자 군단</title>
<style>
html,body{margin:0;height:100%;background:#16201a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;padding:4vw;box-sizing:border-box;background:rgba(10,16,12,.82);overflow-y:auto}
#ui.h{display:none}#ui h2{margin:0;font-size:min(7vw,30px);text-align:center}#ui p{margin:0;font-size:min(4.2vw,17px);opacity:.88;text-align:center}
#ui .small{font-size:min(3.6vw,14px);opacity:.75}
button{font-size:min(4.3vw,18px);padding:1.7vh 3vw;width:min(86vw,360px);border-radius:12px;border:0;background:#2f6fd0;color:#fff;font-weight:600}
button:disabled{background:#3b4450;color:#99a}button.go{background:#e0533b;font-size:min(6vw,24px)}button.off{background:#2e9e5b}button.ad{background:#7a4fd0}button.dia{background:#1d9bb5}button.gray{background:#555}
#ui .stars{display:flex;gap:2vw}#ui .stars i{font-style:normal;font-size:min(16vw,64px);color:#2a3550;text-shadow:0 3px 0 #0b1020;transform:scale(0);animation:starIn .2s ease-out forwards}#ui .stars i.on{color:#FFC83D;text-shadow:0 0 14px rgba(255,200,61,.7),0 3px 0 #7a5a08}
@keyframes starIn{0%{transform:scale(0) rotate(-30deg)}80%{transform:scale(1.25)}100%{transform:scale(1)}}#ui .bonus{color:#FFC83D;font-weight:800}
#ui.hm{justify-content:flex-start;gap:0;padding:0;background:radial-gradient(ellipse at 50% 30%,#4aa8ff 0%,#2a6ad0 55%,#173f8a 100%)}
.htop{display:flex;gap:8px;justify-content:flex-end;align-items:center;width:100%;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top)) 12px 0;flex:0 0 auto}
.hpill{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 10px;border-radius:17px;background:linear-gradient(#22396a,#0f1d3a);border:2px solid #FFC83D;color:#ffe7a8;font:800 15px system-ui}.hpill b{color:#fff}.hpill.dia{border-color:#7fc8ff}
.hic{width:42px!important;height:42px;padding:0!important;border-radius:21px!important;border:2px solid #FFC83D!important;background:linear-gradient(#22396a,#0f1d3a)!important;font-size:20px!important}
.htitle{flex:0 0 auto;margin:4px 0 0;font:900 clamp(26px,9vw,38px) system-ui;color:#FFD84A;letter-spacing:3px;text-shadow:0 3px 0 #b8560a,0 6px 0 #5a2a00,0 0 20px rgba(255,230,120,.7)}
.hhero{flex:1 1 auto;min-height:70px;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.himg{width:90vw;max-width:400px;max-height:100%;object-fit:contain;border-radius:22px;border:3px solid #fff;box-shadow:0 8px 0 #0a2a6a,0 0 26px rgba(120,200,255,.6);animation:hb 2.4s ease-in-out infinite}.hhero svg{width:90vw;max-width:400px;height:auto;max-height:100%;animation:hb 2.4s ease-in-out infinite}@keyframes hb{50%{transform:translateY(-5px)}}
.hglow{position:absolute;left:50%;top:50%;width:70vw;height:70vw;max-width:320px;max-height:100%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,200,61,.22),rgba(255,200,61,0) 65%)}
.hstage{flex:0 0 auto;width:92%;display:flex;align-items:center;gap:6px}
.hcard{flex:1;border-radius:16px;border:3px solid #fff;background:linear-gradient(#4a9cff,#1e5ac8);padding:10px 6px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.45);cursor:pointer}
.hcard .sn{font:900 20px system-ui;color:#fff}.hcard .nm{font:700 13px system-ui;color:#c9d6f0;margin-top:2px}.hcard .bs{font-size:24px;letter-spacing:4px;margin-top:4px;color:#173f8a}.hcard .bs .on{color:#FFC83D}.hcard .tip{font:600 11px system-ui;color:#9fb0d0;margin-top:2px}
.harr{flex:0 0 42px!important;width:42px!important;height:56px;padding:0!important;border-radius:12px!important;border:2px solid #FFC83D!important;background:#0f1d3a!important;color:#FFC83D!important;font:900 30px system-ui!important}.harr:disabled{opacity:.3}
.htot{margin-top:8px;font:800 15px system-ui;color:#ffe7a8}
.hgo{flex:0 0 auto;margin:10px 0 0;width:85%!important;height:60px;border-radius:20px!important;border:3px solid #fff2b0!important;background:linear-gradient(#FFE07A,#FFC83D 55%,#e09a12)!important;color:#2a1e05!important;font:900 clamp(26px,8vw,34px) system-ui!important;letter-spacing:8px;box-shadow:0 5px 0 #7a5a08,0 0 22px rgba(255,200,61,.55)}
.hnav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 6px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#2a6ad0,#173f8a);border-top:2px solid #FFC83D}
.hnav button{flex:1;height:56px;padding:0;background:transparent;color:#FFC83D;font:800 13px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.hnav i{font-style:normal;font-size:24px}
#ui.hm{padding-bottom:84px}
#ui.shop{background:linear-gradient(#13254a,#0a1630);justify-content:flex-start;padding-top:max(14px,env(safe-area-inset-top))}
.back{width:auto!important;align-self:flex-start;background:transparent!important;color:#FFC83D!important;font-weight:800!important;padding:8px 10px!important}
#cfm{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20}
.pop{width:min(86vw,340px);background:linear-gradient(#24427a,#152a52);border:2px solid #FFC83D;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}.pop button{width:100%}.pop .pt{font:900 19px system-ui;color:#FFC83D}
@media (max-height:680px){.htitle{font-size:22px}.hgo{height:50px}.hnav button{height:46px}.hcard{padding:6px}.hcard .bs{font-size:20px}}
</style></head><body><canvas id="c"></canvas><div id="ui" class="h"></div><div id="cfm"></div>

  else{const ng=R.gates.filter(q=>q.z>R.z&&q.z-R.z<12).sort((a,b)=>a.z-b.z)[0],pr=R.bks.filter(o=>o.z>R.z+1.5&&o.z-R.z<22).sort((a,b)=>a.z-b.z)[0],cand=lanes().map(x=>[x,0]);
    if(ng){if(R.pick[ng.id]==null){const row=R.gates.filter(q=>q.id==ng.id).sort((a,b)=>gateVal(b)-gateVal(a));let alt=row.slice(1);if(br()>=P_.red)alt=alt.filter(q=>q.op!='sub');R.pick[ng.id]=br()<P_.pick||!alt.length?row[0]:alt[(br()*alt.length)|0]}const c=R.pick[ng.id];cand.push([(c.x0+c.x1)/2,ng.z-R.z<6?99:4])}
    const rq=R.rc.filter(q=>!q.done&&q.z>R.z+1&&q.z-R.z<20).sort((a,b)=>a.z-b.z)[0];if(rq)cand.push([rq.x,3]);
    if(pr){if(R.chase[pr.z]==null)R.chase[pr.z]=!BADIT[pr.item]&&br()<P_.box;if(R.chase[pr.z])cand.push([pr.x,2.5])}
    if((R.aimT2=(R.aimT2||0)-1/30)<0){R.aimT2=.5;R.aimOK=br()<P_.aim}
    const dps=R.n*soldierDps()*.7,hw=halfW()+.25,cost=x=>{let cum=0,c=0;for(const o of R.zs.filter(o=>o.z>R.z&&o.z-R.z<14&&Math.abs(o.x-x)<hw).sort((a,b)=>a.z-b.z)){cum+=o.hp/Math.max(1,dps);if(cum>(o.z-R.z)/(CFG.SPEED+CFG.ZSPD*ENEMY[o.type].spd))c+=ENEMY[o.type].loss}return c};
    if(R.aimOK){let best=null,bv=1e9;for(const [x,bo] of cand){const v=cost(x)*2-bo+Math.abs(x-R.x)*.1;if(v<bv){bv=v;best=x}}tx=best}
    else{const c=cand.filter(q=>q[1]>0).sort((a,b)=>b[1]-a[1])[0];if(c)tx=c[0]}
    const bl=R.bks.find(o=>o.z>R.z&&o.z-R.z<2&&Math.abs(o.x-tx)<.6);if(bl)tx=lanes()[(bl.li+(bl.li==2?-1:1))]}
  R.tx=clampX(tx)}
// ===== 빠른 시뮬레이션 (테스트용, 화면 없이) =====
function sim(stage,bot,seed,startN,useRev){start(stage,{sim:1,bot,seed,startN});let guard=0;const revs=[];
  while(guard++<200000){if(st=='run'){autopilot();step(1/30)}
    else if(st=='dead'){const o=useRev?reviveOpts().filter(q=>!q.dis):[];if(!o.length){st='run';result(false);break}revs.push(o[0].k);revive(o[0].k)}else break}
  SIM=false;const L=lastRes;L.revs=revs;L.load=R.load;return L}
// ===== 메인 루프 =====
window.__err=[];let lt=performance.now(),paused=0;
function pauseGame(){if(st!='run'||paused||SIM)return;paused=2;touch=null;ui.className='';if(R)R.slow=0;const rf=()=>`효과 줄이기: ${S.rfx?'켬':'끔'}`;ui.innerHTML=`<h2>일시정지</h2><button id=resume>계속하기</button><button class=gray id=rfx>${rf()}</button>`;document.getElementById('resume').onclick=resumeGame;const rb=document.getElementById('rfx');rb.onclick=()=>{S.rfx=S.rfx?0:1;save();rb.textContent=rf()}}
function resumeGame(){if(paused!=2)return;paused=0;touch=null;if(R)R.tx=R.x;ui.className='h';lt=performance.now()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});addEventListener('blur',()=>pauseGame());
let skip1=0;
function loop(t){requestAnimationFrame(loop);const raw=Math.min(.05,(t-lt)/1000);lt=t;let dt=raw*TS;   // gameDt: 일시정지·광고·백그라운드=0, 재개 첫 프레임=0, 슬로모 0.6배
  try{if(SIM)return;if(paused||document.hidden){if(R)R.slow=0;skip1=1;draw();return}if(skip1){skip1=0;dt=0}if(R&&R.slow>0){dt*=.6;R.slow=Math.max(0,R.slow-raw)}window.__gdt=dt;const k=Math.ceil(TS*2);for(let i=0;i<k;i++){if(R&&R.bot)autopilot();step(dt/k)}draw()}catch(e){window.__err.push(String(e.stack||e));console.error(e)}}
requestAnimationFrame(loop);if(!AUTO)menu();A9.load();
{const pb=document.createElement('button');pb.id='pbtn';pb.textContent='❚❚';pb.setAttribute('aria-label','일시정지');pb.style.cssText='position:fixed;left:8px;bottom:8px;width:40px;height:40px;padding:0;font-size:16px;border-radius:20px;background:#0008;z-index:5';pb.onclick=e=>{e.stopPropagation();pauseGame()};document.body.appendChild(pb);setInterval(()=>{pb.style.display=st=='run'&&!paused?'':'none'},200)}
window.GAME={BXD,BXK,bxHp,get R(){return R},get st(){return st},get paused(){return paused},pauseGame,resumeGame,fakeAd,get S(){return S},start,sim,CFG,menu,revive,die};
