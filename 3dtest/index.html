 const mx=new THREE.AnimationMixer(o);const a=mx.clipAction(clip(M,anim||M.run));a.play();a.time=Math.random()*a.getClip().duration;a.timeScale=speed;return {g,o,mx,act:a,M}}

const solPool=[];const zUnits=[];let bossU=null;

// ===== squad: v9 sqSC + layout() ported 1:1 (v9 z forward = three -z) =====
const SQ={show:+(Q.get('show')||0),n:+(Q.get('n')||5),x:0,tx:0,squeeze:false,sq:[]};
const sqSC=()=>{const n=Math.min(SQ.n,100),k=n<=15?1:n<=40?.88:n<=70?.76:.66;return Math.min(1.58,.07*H*CFG.CAMD/(.413*F))*k};
const sqH=()=>.413*sqSC();
function layout(N){const L=CFG.LANE,sw=.134*sqSC(),SP=.7*sw,RZ=.32*sqH();
 let A=(SQ.squeeze?.425:.6)*L-sw/2;const lo=-CFG.ROAD+.05*L+sw/2-SQ.x,hi=CFG.ROAD-.05*L-sw/2-SQ.x,C=[];
 for(let r=-40;r<=40;r++)for(let c=-25;c<=25;c++){const x=(c+(r&1?.5:0))*SP,z=r*RZ;if(Math.abs(x)>A+1e-6||x<lo||x>hi)continue;C.push([x,z,(x/SP)**2+(z/RZ)**2*.55+Math.abs(c)*1e-4])}
 C.sort((p,q)=>p[2]-q[2]);const o=C.slice(0,N);if(!o.length)o.push([0,0,0]);const zt=Math.max(...o.map(q=>q[1]));
 for(const q of o)q[1]-=zt;o.sort((p,q)=>q[1]-p[1]||Math.abs(p[0])-Math.abs(q[0]));return o.map(q=>[q[0],q[1]])}

 while(SQ.sq.length<N){const t=tg[SQ.sq.length]||[0,0];SQ.sq.push({ox:t[0],oz:t[1],ph:Math.random()*6.28,fire:Math.random()*.28,fl:0})}
 SQ.sq.length=N;const k=Math.min(1,dt*12);SQ.sq.forEach((q,i)=>{q.ox+=(tg[i][0]-q.ox)*k;q.oz+=(tg[i][1]-q.oz)*k})}
const dispN=()=>{const n=Math.min(SQ.n,100);return SQ.show?Math.min(n,SQ.show):n};
const clampX=x=>Math.max(-CFG.ROAD+.25,Math.min(CFG.ROAD-.25,x));
function setN(n){SQ.n=n;SQ.sq.length=0;document.getElementById('num').textContent=n;document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n))}
document.querySelectorAll('#ui2 button').forEach(b=>{b.classList.toggle('on',+b.dataset.s===SQ.show);b.onclick=e=>{e.stopPropagation();SQ.show=+b.dataset.s;SQ.sq.length=0;document.querySelectorAll('#ui2 button').forEach(c=>c.classList.toggle('on',c===b))}});
document.querySelectorAll('#ui button').forEach(b=>b.onclick=e=>{e.stopPropagation();setN(+b.dataset.n)});
// v9 steering: drag (px / (F/CAMD)) and arrow keys ±0.5

canvas.addEventListener('pointermove',e=>{if(!touch)return;SQ.tx=clampX(touch.tx+(e.clientX-touch.px)/(F/CFG.CAMD))});
const endT=()=>{touch=null};canvas.addEventListener('pointerup',endT);canvas.addEventListener('pointercancel',endT);
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')SQ.tx=clampX(SQ.tx-.5);if(e.key=='ArrowRight')SQ.tx=clampX(SQ.tx+.5)});
if(Q.has('x'))SQ.x=SQ.tx=clampX(+Q.get('x'));

// ===== zombie horde =====
const ZPAL=[[0x8fc46a,0xb8452e,0x3d4f6e],[0x9fb5a0,0x6b5a3e,0x2d2d36],[0x7fae5a,0x3f6fb0,0x4a3b2e],[0xa8c98a,0x8a8a8a,0x2e3f55],[0x86b07a,0xd9c46b,0x55463a],[0x92b884,0xffffff,0x3b4a66]];

 const r=Math.random();z.type=r<.06?'tank':r<.24?'fast':'normal';z.sz=z.type=='tank'?1.5*1.12:z.type=='fast'?.8:1;z.hp=z.type=='tank'?40:10;

Z.forEach(z=>spawnZ(z,false));

// ===== decorations =====
(async()=>{try{
 const [tOak,tDef,tPine,tPineC,tFat,rock,box,barrel,fence,barrier,tower]=await Promise.all(['assets/tree_oak.glb','assets/tree_default.glb','assets/tree_pineRoundA.glb','assets/tree_pineRoundC.glb','assets/tree_fat.glb','assets/rock_largeA.glb','assets/surv/box-large.glb','assets/surv/barrel.glb','assets/surv/fence-fortified.glb','assets/city/construction-barrier.glb','assets/td/wood-structure-high.glb'].map(loadGLB));
 const brighten=m=>{if(m.color){const h={};m.color.getHSL(h);if(h.h>0.2&&h.h<0.55)m.color.setHSL(0.29+Math.random()*0.04,0.62,Math.min(0.42,h.l*0.75));else m.color.setHSL(h.h,Math.min(1,h.s*1.3),h.l*0.95)}m.roughness=0.55};
 [tOak,tDef,tPine,tPineC,tFat].forEach((t,k)=>{const its=[];for(let i=0;i<8;i++){const sx=(i+k)%2?1:-1;its.push({x:sx*rnd(ROADW/2+2.6,ROADW/2+9),z:ZNEAR-rnd(0,LOOP),s:rnd(2.6,3.6),ry:rnd(0,6)})}decor(instFrom(t,its.length,brighten),its)});
 {const its=[];const n=Math.ceil(LOOP/2.0);for(const sx of [-1,1])for(let i=0;i<n;i++)its.push({x:sx*(ROADW/2+0.9),z:ZNEAR-i*2.0,s:2.0,ry:Math.PI/2});decor(instFrom(fence,its.length,brighten),its)}
 {const its=[];for(const sx of [-1,1])for(let i=0;i<10;i++)its.push({x:sx*(ROADW/2+0.1),z:ZNEAR-i*9-4*(sx+1),s:1.6,ry:Math.PI/2});decor(instFrom(barrier,its.length,brighten),its)}
 {const its=[];for(let i=0;i<5;i++){const sx=i%2?-1:1;its.push({x:sx*(ROADW/2+2),z:ZNEAR-i*17-8,s:1.8})}decor(instFrom(barrel,its.length,brighten),its)}
 {const its=[];for(let i=0;i<14;i++){const sx=i%2?-1:1;its.push({x:sx*rnd(ROADW/2+3,ROADW/2+9),z:ZNEAR-rnd(0,LOOP),s:rnd(1.5,3),ry:rnd(0,6)})}decor(instFrom(rock,its.length,brighten),its)}
 {decor(instFrom(tower,1,brighten),[{x:-(ROADW/2+6),z:-40,s:3.2}])}
 // v9 crates sit on lane centres (0.6 wide) — Kenney crate is ~1 env unit at s=1
 {const its=[];for(let i=0;i<4;i++){its.push({x:[-1,1,0,-1][i]*CFG.LANE/K,z:ZNEAR-i*22-12,s:0.6/K})}decor(instFrom(box,its.length,brighten),its)}
}catch(e){console.error('asset load',e)}
 try{await loadModels()}catch(e){modelErr=String(e);console.error('models',e)}window.__models=modelsOK;window.__ready=true})();

// ===== loop =====
fit();setN(SQ.n);
const clock=new THREE.Clock();let t=0,fcount=0,t0=performance.now();window.__fps=0;
const fpsEl=document.getElementById('fps');if(Q.has('fps'))fpsEl.style.display='block';
const root=new THREE.Matrix4();let bi=0;
function fireBullet(x,y,z){const b=B[bi];bi=(bi+1)%BN;b.a=1;b.x=x;b.y=y;b.z=z}
let cyc=0;
function frame(){
 const dt=Math.min(clock.getDelta(),0.05);t+=dt;fcount++;
 const dzv=CFG.SPEED*dt;   // v9 units the world moves toward the squad
 roadTex.offset.y+=dzv/K/20;curbTex.offset.y+=dzv/K/4;grassTex.offset.y+=dzv/K/4;for(const s of scrollers)s.upd(dzv/K);
 // phases: gate run, then boss walks in (boss never behind a gate panel)
 cyc+=dt;const ph=PHASE||(cyc%18<9?'gate':'boss');
 if(ph=='gate'){if(PHASE=='gate'&&Q.has('gz'))gateZ=+Q.get('gz');else{gateZ+=dzv;if(gateZ>1.5)gateZ=-30}}else gateZ=99;
 for(const g of gates){g.visible=gateZ<2;g.position.z=gateZ}
 // v9: squeeze formation when a gate is within .8*SPEED ahead
 SQ.squeeze=gateZ<0&&-gateZ<.8*CFG.SPEED;
 SQ.x+=(SQ.tx-SQ.x)*Math.min(1,dt/.12);
 updateSquad(dt);
 const SC=sqSC();blobN=0;let fi=0;
 if(modelsOK){
 const sS=1.5*0.432*SC/MODELS.sol.h;
 while(solPool.length<SQ.sq.length){const u=spawnUnit('sol','Run_Gun',1.1);u.g.rotation.y=Math.PI;solPool.push(u)}
 for(let i=0;i<solPool.length;i++){const u=solPool[i];const on=i<SQ.sq.length;u.g.visible=on;if(!on)continue;const q=SQ.sq[i];const x=SQ.x+q.ox,z=-q.oz;
  u.g.position.set(x,0,z);u.g.scale.setScalar(sS);u.mx.update(dt);blob(x,z,0.26*SC);
  q.fire-=dt;const gx=x+.062*SC,gy=.21*SC,gz=z-.14*SC;if(q.fire<=0){q.fire=.16+Math.random()*.04;fireBullet(gx,gy,gz);q.fl=.05}
  if(q.fl>0&&fi<110){q.fl-=dt;const sc=(.12+Math.random()*.06)*SC;_m.compose(_v.set(gx,gy,gz),cam.quaternion,_s.set(sc,sc,sc));flashes.setMatrixAt(fi++,_m);_s.set(1,1,1)}}
 // zombies (v9 heights .78*sz)
 while(zUnits.length<ZN){const z=Z[zUnits.length];const u=spawnUnit('zom','Walk',z.spd*1.2);zUnits.push(u)}
 for(let i=0;i<ZN;i++){const z=Z[i],u=zUnits[i];
  if(z.dead>0){z.dead+=dt;if(z.dead>1.4){spawnZ(z,true);backToRun(u)}}
  else{z.z+=z.spd*1.1*dt;if(z.kb>0){z.z-=z.kb*dt*3;z.kb=Math.max(0,z.kb-dt*4)}if(z.z>-0.6){spawnZ(z,true)}}
  if(z.justDied){z.justDied=0;playOnce(u,'Death')}
  const hz=.78*z.sz,s=hz/MODELS.zom.h,sink=z.dead>1?(z.dead-1)*.5:0;
  u.g.position.set(z.x,-sink,z.z);u.g.scale.set(s*z.fat,s,s*z.fat);u.mx.update(dt);if(z.dead<=0)blob(z.x,z.z,hz*.6)}
 // boss: v9 height 2.5, tank silhouette (wider, stockier)
 if(!bossU){bossU=spawnUnit('orc','Walk',.8)}
 boss.visible=bossU.g.visible=ph=='boss';if(ph=='boss'){if(PHASE=='boss')bossZ=+(Q.get('bz')||-12);else{bossZ+=dt*.5;if(bossZ>-7)bossZ=-16}}else bossZ=-16;
 {const bs=2.5/MODELS.orc.h;bossU.g.position.set(0,0,bossZ);bossU.g.scale.set(bs*1.35,bs,bs*1.25);boss.position.set(0,0,bossZ);if(boss.visible)bossU.mx.update(dt)}
 }
 {const v=new THREE.Vector3(SQ.x,.62*SC+.12,0).project(cam);const el=document.getElementById('cnt');el.style.left=((v.x+1)/2*100)+'%';el.style.top=((1-v.y)/2*100)+'%';}
 flashes.count=fi;flashes.instanceMatrix.needsUpdate=true;
 // bullets: v=45, straight
 let bn=0;for(const b of B){if(!b.a)continue;b.z-=45*dt;if(b.z<-30){b.a=0;continue}
  for(const z of Z){const hw=.15*z.sz+.08;if(z.dead<=0&&Math.abs(b.x-z.x)<hw&&b.z<z.z+.15&&b.z>z.z-.4){b.a=0;z.hp--;z.hit=1;z.kb=.15;puff(b.x,.35*z.sz,z.z+.1);if(z.hp<=0){z.dead=.001;z.justDied=1;for(let k=0;k<3;k++)puff(z.x+rnd(-.1,.1),rnd(.2,.6),z.z)}break}}
  if(b.a&&boss.visible&&Math.abs(b.x)<.75&&b.z<bossZ+.4&&b.z>bossZ-.3){b.a=0;bossHit=1;puff(b.x,rnd(.5,1.8),bossZ+.4)}
  if(!b.a)continue;_m.compose(_v.set(b.x,b.y,b.z),_q.identity(),_s);bullets.setMatrixAt(bn++,_m)}
 bullets.count=bn;bullets.instanceMatrix.needsUpdate=true;
 let pn=0;for(const p of P){if(p.t<=0)continue;p.t-=dt;p.y+=dt*.5;const sc=.07*(p.t/.3);_m.compose(_v.set(p.x,p.y,p.z),_q.identity(),_s.set(sc,sc,sc));_s.set(1,1,1);puffs.setMatrixAt(pn++,_m)}
 puffs.count=pn;puffs.instanceMatrix.needsUpdate=true;blobs.count=blobN;blobs.instanceMatrix.needsUpdate=true;
 R.render(S,cam);
 const now=performance.now();if(now-t0>=1000){window.__fps=fcount*1000/(now-t0);fpsEl.textContent=window.__fps.toFixed(0)+' fps · '+R.info.render.calls+' draws';window.__calls=R.info.render.calls;window.__tris=R.info.render.triangles;fcount=0;t0=now}
 requestAnimationFrame(frame)}
