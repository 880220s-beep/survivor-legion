// ---------- sky
{const g=new THREE.SphereGeometry(200,24,12);const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,

  d.im.setMatrixAt(i,_m);
 }
}

 add(G.sph,sk,[-1.75,0.95,-0.45],[0.55,0.5,0.55]);add(G.sph,sk,[1.75,0.95,-0.45],[0.55,0.5,0.55]); // fists
 add(G.sph,sk,[-1.15,2.85,-0.1],[0.75,0.6,0.7]);add(G.sph,sk,[1.15,2.85,-0.1],[0.75,0.6,0.7]); // shoulders
 add(G.sph,sk,[0,3.35,-0.55],[0.55,0.5,0.5]); // small head
 add(G.sph,ey,[-0.2,3.42,-1.0],[0.1,0.08,0.05]);add(G.sph,ey,[0.2,3.42,-1.0],[0.1,0.08,0.05]);
 add(G.rbox,dk,[0,3.15,-0.98],[0.45,0.12,0.06]);
 const bb=new THREE.Mesh(blobGeo,blobMat);bb.scale.set(4,1,3);bb.position.y=0.03;boss.add(bb);

boss.rotation.y=Math.PI; // faces +z (toward player)
let bossZ=-34,bossHit=0;

// ---------- bullets & muzzle
const bulletGeo=new THREE.CapsuleGeometry(0.06,0.7,3,6).rotateX(Math.PI/2);
const bulletMat=new THREE.MeshBasicMaterial({color:0xffd75a,toneMapped:false});
const BN=260;const bullets=new THREE.InstancedMesh(bulletGeo,bulletMat,BN);bullets.frustumCulled=false;S.add(bullets);
const B=[];for(let i=0;i<BN;i++)B.push({a:0,x:0,y:0,z:0});
const flashTex=canvasTex(64,64,(x)=>{const g=x.createRadialGradient(32,32,1,32,32,30);g.addColorStop(0,'rgba(255,255,220,1)');g.addColorStop(.35,'rgba(255,200,60,.9)');g.addColorStop(1,'rgba(255,120,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64)});
const flashMat=new THREE.MeshBasicMaterial({map:flashTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false});
const flashes=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),flashMat,120);flashes.frustumCulled=false;S.add(flashes);
// hit sparks / goo puffs
const puffMat=new THREE.MeshBasicMaterial({color:0xffb347,toneMapped:false});
const PN=80;const puffs=new THREE.InstancedMesh(G.sph,puffMat,PN);puffs.frustumCulled=false;S.add(puffs);const P=[];for(let i=0;i<PN;i++)P.push({t:0});

// ---------- formation
function displayCount(n){const T=[[1,1],[3,3],[5,5],[10,10],[30,22],[50,28],[100,36],[1000,60]];if(n<=1)return 1;for(let i=1;i<T.length;i++)if(n<=T[i][0]){const [a,b]=T[i-1],[c,d]=T[i];return Math.round(b+(d-b)*(n-a)/(c-a))}return 60}
let soldiers=[];
function setN(n){REAL=n;document.getElementById('num').textContent=n;const d=displayCount(n);
 const cols=d<=3?d:d<=5?3:d<=10?4:d<=22?5:6; const sp=d<=5?1.45:d<=10?1.15:0.95; // ~1.35x body width (0.7)
 soldiers=[];for(let i=0;i<d;i++){const r=Math.floor(i/cols),c=i%cols;const rowN=Math.min(cols,d-r*cols);
  const stag=(r%2)*0.0;soldiers.push({x:(c-(rowN-1)/2)*sp+stag,z:r*sp*1.05,ph:Math.random()*6.28,fire:Math.random()*0.3})}
 for(const d2 of SOLD)d2.im.count=d;
 document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
 const rows=Math.ceil(d/cols);camTarget=rows;
}
let camTarget=1;
document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>setN(+b.dataset.n));

// ---------- zombies
const ZPAL=[[0x8fc46a,0xb8452e,0x3d4f6e],[0x9fb5a0,0x6b5a3e,0x2d2d36],[0x7fae5a,0x3f6fb0,0x4a3b2e],[0xa8c98a,0x8a8a8a,0x2e3f55],[0x86b07a,0xd9c46b,0x55463a],[0x92b884,0xffffff,0x3b4a66]];
const Z=[];
for(let i=0;i<ZN;i++)Z.push({});
function spawnZ(z,far){const p=ZPAL[Math.random()*ZPAL.length|0];z.x=rnd(-3.4,3.4);z.z=far?rnd(-30,-18):rnd(-26,-12);z.hp=9;z.ph=Math.random()*6;z.dead=0;z.hit=0;z.kb=0;
 z.body=Math.random();z.sx=z.body<.3?1.35:z.body<.6?0.9:1.05;z.sy=z.body<.3?0.95:z.body<.6?1.15:1.0;z.spd=rnd(1.2,2.0);
 z.col=p.map(c=>new THREE.Color(c));}
Z.forEach(z=>spawnZ(z,false));

// ---------- decorations (async GLB load)
let ready=false;
(async()=>{
 try{
 const [tOak,tDef,tPine,tPineC,tFat,rock,box,barrel,fence,barrier,tower]=await Promise.all(['assets/tree_oak.glb','assets/tree_default.glb','assets/tree_pineRoundA.glb','assets/tree_pineRoundC.glb','assets/tree_fat.glb','assets/rock_largeA.glb','assets/surv/box-large.glb','assets/surv/barrel.glb','assets/surv/fence-fortified.glb','assets/city/construction-barrier.glb','assets/td/wood-structure-high.glb'].map(loadGLB));
 const brighten=m=>{if(m.color){const h={};m.color.getHSL(h);if(h.h>0.2&&h.h<0.55){m.color.setHSL(0.29+Math.random()*0.04,0.62,Math.min(0.42,h.l*0.75))}else m.color.setHSL(h.h,Math.min(1,h.s*1.3),h.l*0.95)}m.roughness=0.55};
 const trees=[tOak,tDef,tPine,tPineC,tFat];
 trees.forEach((t,k)=>{const its=[];for(let i=0;i<8;i++){const sx=(i+k)%2?1:-1;its.push({x:sx*rnd(ROADW/2+2.6,ROADW/2+9),z:-rnd(0,LOOP)+ZNEAR,s:rnd(2.6,3.6),ry:rnd(0,6)})}decor(instFrom(t,its.length,brighten),its)});
 // fences both sides, continuous
 {const its=[];const n=Math.ceil(LOOP/2.0);for(const sx of [-1,1])for(let i=0;i<n;i++)its.push({x:sx*(ROADW/2+0.9),z:ZNEAR-i*2.0,s:2.0,ry:Math.PI/2});decor(instFrom(fence,its.length,brighten),its)}
 // red-white barriers at road edge
 {const its=[];for(const sx of [-1,1])for(let i=0;i<10;i++)its.push({x:sx*(ROADW/2+0.1),z:ZNEAR-i*9-4*(sx+1),s:1.6,ry:Math.PI/2});decor(instFrom(barrier,its.length,brighten),its)}
 // crates on shoulders
 {const its=[];for(let i=0;i<8;i++){const sx=i%2?1:-1;its.push({x:sx*(ROADW/2-0.9),z:ZNEAR-i*11-3,s:2.2,ry:rnd(-.2,.2)})}decor(instFrom(box,its.length,brighten),its)}
 {const its=[];for(let i=0;i<5;i++){const sx=i%2?-1:1;its.push({x:sx*(ROADW/2+2),z:ZNEAR-i*17-8,s:1.8})}decor(instFrom(barrel,its.length,brighten),its)}
 {const its=[];for(let i=0;i<14;i++){const sx=i%2?-1:1;its.push({x:sx*rnd(ROADW/2+3,ROADW/2+9),z:ZNEAR-rnd(0,LOOP),s:rnd(1.5,3),ry:rnd(0,6)})}decor(instFrom(rock,its.length,brighten),its)}
 {const its=[{x:-(ROADW/2+6),z:-40,s:3.2}];decor(instFrom(tower,1,brighten),its)}
 }catch(e){console.error('asset load',e)}
 ready=true;window.__ready=true;
})();

// ---------- loop
setN(REAL);
const clock=new THREE.Clock();let t=0;let fcount=0,facc=0;window.__fps=0;
const fpsEl=document.getElementById('fps');if(Q.has('fps'))fpsEl.style.display='block';
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const root=new THREE.Matrix4();let bi=0;
function fireBullet(x,y,z){const b=B[bi];bi=(bi+1)%BN;b.a=1;b.x=x;b.y=y;b.z=z}
let gateZ=-26;
function frame(){
 let dt=Math.min(clock.getDelta(),0.05);if(Q.has('frozen'))dt=0.016*(+Q.get('frozen')||1);t+=dt;
 fcount++;const nowp=performance.now();if(!window.__t0)window.__t0=nowp;facc=(nowp-window.__t0)/1000;
 const dz=SPEED*dt;
 roadTex.offset.y+=dz/20; grassTex.offset.y+=dz/4;
 for(const s of scrollers)s.upd(dz);
 gateZ+=dz;if(gateZ>ZNEAR)gateZ=-60;gate.position.z=gateZ;gate.userData.halo.material.opacity=0.45+0.15*Math.sin(t*4);
 // camera framing by formation depth
 const rows=camTarget;const back=rows*1.0;
 const D=(rows-1)*1.0;cam.position.set(0,5.8+D*1.1,10.5+D*2.0);cam.lookAt(0,0.3,-12+D*0.6);
 // soldiers
 blobN=0;let fi=0;
 for(let i=0;i<soldiers.length;i++){const s=soldiers[i];s.ph+=dt*11;const bob=Math.abs(Math.sin(s.ph))*0.08;
  root.compose(_v.set(s.x,bob,s.z),_q.identity(),_s.set(1.05,1.05,1.05));_s.set(1,1,1);
  placeParts(SOLD,i,root,s.ph);blob(s.x,s.z,1.0);
  s.fire-=dt;if(s.fire<=0){s.fire=0.16+Math.random()*0.06;fireBullet(s.x+0.13,1.07,s.z-1.0);s.fl=0.06}
  if(s.fl>0&&fi<120){s.fl-=dt;const sc=0.8+Math.random()*0.4;_m.compose(_v.set(s.x+0.13,1.08,s.z-1.0),cam.quaternion,_s.set(sc,sc,sc));flashes.setMatrixAt(fi++,_m);_s.set(1,1,1)}}
 flashes.count=fi;flashes.instanceMatrix.needsUpdate=true;
 for(const d of SOLD)d.im.instanceMatrix.needsUpdate=true;
 // zombies
 for(let i=0;i<ZN;i++){const z=Z[i];
  if(z.dead>0){z.dead+=dt;if(z.dead>1.1)spawnZ(z,true)}
  else{z.z+=(z.spd+SPEED*0.0)*dt;z.ph+=dt*6;if(z.kb>0){z.z-=z.kb*dt*8;z.kb=Math.max(0,z.kb-dt*4)}if(z.z>-1.5)spawnZ(z,true)}
  z.hit=Math.max(0,z.hit-dt*5);
  const fall=z.dead>0?Math.min(1,z.dead*3):0;const sink=z.dead>0.6?(z.dead-0.6)*2:0;
  _e.set(-fall*1.45,Math.PI+Math.sin(z.ph*0.5)*0.15,Math.sin(z.ph)*0.08);_q.setFromEuler(_e);
  root.compose(_v.set(z.x,Math.abs(Math.sin(z.ph))*0.05-sink,z.z),_q,_s.set(z.sx,z.sy,z.sx));_s.set(1,1,1);
  placeParts(ZOMB,i,root,z.ph,{armUp:Math.sin(z.ph)*0.2});
  if(z.dead<=0)blob(z.x,z.z,1.1*z.sx);
  const h=z.hit;const tint=(c)=>c.clone().lerp(new THREE.Color(0xff6a5a),h*0.6);
  ZOMB[0].im.setColorAt(i,tint(z.col[2]));ZOMB[1].im.setColorAt(i,tint(z.col[2]));ZOMB[2].im.setColorAt(i,tint(z.col[1]));
  for(const k of [3,4,5])ZOMB[k].im.setColorAt(i,tint(z.col[0]));}
 for(const d of ZOMB){d.im.count=ZN;d.im.instanceMatrix.needsUpdate=true;if(d.im.instanceColor)d.im.instanceColor.needsUpdate=true}
 // boss
 bossZ+=dt*0.9;if(bossZ>-12)bossZ=-40;const bph=t*3.2;
 boss.position.set(0,Math.abs(Math.sin(bph))*0.1,bossZ);boss.userData.legL.rotation.x=Math.sin(bph)*0.5;boss.userData.legR.rotation.x=-Math.sin(bph)*0.5;
 boss.userData.armL.rotation.x=0.2+Math.sin(bph)*0.35;boss.userData.armR.rotation.x=0.2-Math.sin(bph)*0.35;
 bossHit=Math.max(0,bossHit-dt*5);boss.traverse(o=>{if(o.userData.c0)o.material.color.copy(o.userData.c0).lerp(new THREE.Color(0xff8070),bossHit*0.35)});
 blob(0,0,0);blobN--; // noop keep
 // bullets
 let bn=0;
 for(const b of B){if(!b.a)continue;b.z-=40*dt;
  if(b.z<-45){b.a=0;continue}
  for(const z of Z){if(z.dead<=0&&Math.abs(b.x-z.x)<0.45*z.sx&&b.z<z.z+0.3&&b.z>z.z-0.6){b.a=0;z.hp--;z.hit=1;z.kb=0.4;puff(b.x,1.2,z.z+0.3);if(z.hp<=0){z.dead=0.001;for(let k=0;k<4;k++)puff(z.x+rnd(-.3,.3),rnd(.6,1.6),z.z)}break}}
  if(b.a&&Math.abs(b.x)<2.3&&b.z<bossZ+1.2&&b.z>bossZ-0.8){b.a=0;bossHit=1;puff(b.x,rnd(1.5,3),bossZ+1.2)}
  if(!b.a)continue;_m.compose(_v.set(b.x,b.y,b.z),_q.identity(),_s);bullets.setMatrixAt(bn++,_m)}
 bullets.count=bn;bullets.instanceMatrix.needsUpdate=true;
 let pn=0;for(const p of P){if(p.t<=0)continue;p.t-=dt;p.y+=dt*1.5;p.z+=dz;const sc=0.18*(p.t/0.35);_m.compose(_v.set(p.x,p.y,p.z),_q.identity(),_s.set(sc,sc,sc));_s.set(1,1,1);puffs.setMatrixAt(pn++,_m)}
 puffs.count=pn;puffs.instanceMatrix.needsUpdate=true;
 blobs.count=blobN;blobs.instanceMatrix.needsUpdate=true;
 R.render(S,cam);
 if(facc>=1){window.__fps=fcount/facc;fpsEl.textContent=window.__fps.toFixed(0)+' fps · '+R.info.render.calls+' draws';window.__calls=R.info.render.calls;window.__tris=R.info.render.triangles;fcount=0;facc=0;window.__t0=nowp}

}
let pi=0;function puff(x,y,z){const p=P[pi];pi=(pi+1)%PN;p.t=0.35;p.x=x;p.y=y;p.z=z}
requestAnimationFrame(frame);
</script></body></html>
